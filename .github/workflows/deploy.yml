name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions: { contents: read }
concurrency: { group: production-deploy, cancel-in-progress: false }
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.workflow_run.head_sha }}' }
      - name: Configure SSH
        env:
          SSH_KEY: '${{ secrets.VPS_SSH_KEY }}'
          KNOWN_HOSTS: '${{ secrets.VPS_KNOWN_HOSTS }}'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy immutable images
        env:
          VPS_HOST: '${{ secrets.VPS_HOST }}'
          VPS_USER: '${{ secrets.VPS_USER }}'
          DEPLOY_SHA: '${{ github.event.workflow_run.head_sha }}'
        run: |
          scp docker-compose.prod.yml "$VPS_USER@$VPS_HOST:/opt/trackr/docker-compose.prod.yml"
          scp infra/caddy/Caddyfile "$VPS_USER@$VPS_HOST:/opt/trackr/infra/caddy/Caddyfile"
          scp infra/scripts/deploy.sh "$VPS_USER@$VPS_HOST:/opt/trackr/infra/scripts/deploy.sh"
          ssh "$VPS_USER@$VPS_HOST" "cd /opt/trackr && IMAGE_TAG='$DEPLOY_SHA' bash infra/scripts/deploy.sh"
